name: Release

on:
  push:
    tags:
      - "v[0-9]*"            # every tag (incl. session-close bead tags) -> tests only
  release:
    types: [published]        # intentional release -> tests + PyPI publish
  workflow_dispatch:          # manual release (version from VERSION file) -> tests + PyPI publish

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run test suite
        run: uv run pytest -q

  publish:
    needs: test
    # Gate: publish only on an intentional release or manual dispatch,
    # never on a bare tag push (session-close tags every bead close).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moneymoney-cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set package version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION)"
          fi
          uv version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Release v${{ steps.ver.outputs.version }}
          generate_release_notes: true
