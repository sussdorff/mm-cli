# THE KEYWORDS BELOW HAVE NO RUNTIME CONSUMER (clc-6t9h, 2026-08-05).
#
# Verifiable state of this file, as two separate facts:
#
# 1. This file's PRESENCE is load-bearing. A directory under standards/ that
#    carries a _triggers.yml is classified and installed as a bundle
#    (tests/test_standard_bundle_entry_files.py). Do not delete this file.
# 2. This file's CONTENT is not. No component reads the keyword lists:
#    skills/inject-standards/runner.py lists _triggers.yml in SKIP_NAMES and
#    never parses it, and no standards-loader hook is registered in any harness.
#    So no keyword below injects anything, and listing a file here does not make
#    its rules mechanically enforced.
#
# Delivery contract. A standard reaches a model only where a consuming skill or
# agent declares `requires_standards:` (NORMATIVE, meta/docs/primitives/standard.md).
# For bead-hygiene.md that means the primitives declaring it — currently
# skills/intake and skills/workplan. Its
# short always-on summary in runtime-configs/AGENTS.md is a separate delivery path,
# maintained by hand and not derived from this file.
#
# The keyword lists are kept as authored trigger vocabulary for a possible future
# loader. Do not cite an entry here as evidence that a standard is in context.
#
# Original header, kept for provenance (its auto-injection claim describes intended,
# not implemented, behavior):
#   Auto-generated from ~/.claude/standards/index.yml (CL-4bv recovery).
#   Per-file triggers for the standards-loader hook. Edit to refine.
